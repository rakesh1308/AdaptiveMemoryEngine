# fly.toml - AdaptiveMemoryEngine
app = "adaptive-memory-engine"
primary_region = "sin"

[build]

[env]
  PORT = "3000"
  TRANSPORT = "http"
  PROVIDER_TYPE = "openai"
  DATA_DIR = "/data"

[mounts]
  source = "ame_data"
  destination = "/data"

[[services]]
  protocol = "tcp"
  internal_port = 3000

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[http_service]
  internal_port = 3000
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
