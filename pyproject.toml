[project]
name = "adaptive-memory"
version = "4.0.0"
description = "Private, local memory for your coding agents. One file, no cloud, no API key."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
authors = [{ name = "Rakesh Sonawane" }]
keywords = ["mcp", "memory", "agents", "claude-code", "cursor", "local-first", "embeddings"]
dependencies = [
    "mcp>=1.2",
    "fastembed>=0.4",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
adaptive-memory = "adaptive_memory.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
