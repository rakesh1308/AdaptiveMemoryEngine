[project]
name = "adaptive-memory-engine"
version = "2.0.0"
description = "Semantic memory for AI assistants. Pluggable, private, and MCP-native. (Python port)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rakesh Sonawane" }]
dependencies = [
    "mcp[cli]>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "pypdf>=4.0.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
adaptive-memory = "adaptive_memory_engine.cli:main"
ame = "adaptive_memory_engine.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adaptive_memory_engine = ["py.typed"]